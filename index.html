<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Be My Valentine 💜</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #6a00ff, #b517ff);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      color: white;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      max-width: 360px;
      width: 92%;
      position: relative;
      z-index: 2;
    }

    h1 {
      color: #fff;
      font-size: 24px;
      margin-bottom: 12px;
    }

    .hint {
      font-size: 12px;
      opacity: 0.8;
      margin-bottom: 10px;
    }

    .buttons {
      position: relative;
      height: 100px;
      margin-top: 16px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      position: absolute;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 14px rgba(0,0,0,0.25);
    }

    #yesBtn {
      background-color: #38b000;
      color: white;
      left: 20px;
    }

    #noBtn {
      background-color: #d00000;
      color: white;
      right: 20px;
    }

    #message {
      display: none;
      margin-top: 18px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
    }

    .heart {
      position: absolute;
      pointer-events: none;
      color: pink;
      font-size: 20px;
      animation: float 6s linear infinite;
      opacity: 0.7;
      z-index: 1;
    }

    @keyframes float {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      50% { opacity: 0.9; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    .confetti {
      position: absolute;
      width: 6px;
      height: 10px;
      background: white;
      opacity: 0.9;
      animation: fall 2.2s linear forwards;
      z-index: 3;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg); }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Free romantic music -->
  <audio id="music" loop>
    <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_115b9a7c2c.mp3" type="audio/mpeg">
  </audio>

  <div class="card" id="card">
    <h1>Bells, will you be my Valentine? 💘</h1>
    <div class="hint">Tap anywhere to start the music 🎵</div>

    <div class="buttons">
      <button id="yesBtn">Yes ✅</button>
      <button id="noBtn">No ❌</button>
    </div>

    <div id="message">
      Let’s go for a picnic this weekend (bring a blanket) 🧺❤️
    </div>
  </div>

  <script>
    // Start music on first tap (mobile-friendly)
    const music = document.getElementById("music");
    document.body.addEventListener("click", () => {
      if (music.paused) music.play();
    }, { once: true });

    // No button runs away + Yes grows
    let yesSize = 16;
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");

    function moveNoBtn() {
      const x = Math.random() * 240 - 120;
      const y = Math.random() * 120 - 60;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
      yesSize += 6;
      yesBtn.style.fontSize = yesSize + "px";
      yesBtn.style.boxShadow = "0 0 20px rgba(56,176,0,0.8)";
      setTimeout(() => yesBtn.style.boxShadow = "0 6px 14px rgba(0,0,0,0.25)", 200);
    }

    noBtn.addEventListener("mouseover", moveNoBtn);
    noBtn.addEventListener("click", moveNoBtn);

    // Yes click = confetti + message
    yesBtn.addEventListener("click", function() {
      document.querySelector(".buttons").style.display = "none";
      document.getElementById("message").style.display = "block";
      burstConfetti();
      heartBurst();
    });

    // Floating hearts
    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = Math.random() * 18 + 12 + "px";
      heart.style.animationDuration = Math.random() * 3 + 4 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }
    setInterval(createHeart, 280);

    // Confetti burst
    function burstConfetti() {
      for (let i = 0; i < 80; i++) {
        const conf = document.createElement("div");
        conf.className = "confetti";
        conf.style.left = Math.random() * 100 + "vw";
        conf.style.background = ["#fff", "#ffd6ff", "#c77dff", "#ffccd5"][Math.floor(Math.random()*4)];
        conf.style.animationDuration = Math.random() * 1 + 1.5 + "s";
        document.body.appendChild(conf);
        setTimeout(() => conf.remove(), 2200);
      }
    }

    // Heart burst on Yes
    function heartBurst() {
      for (let i = 0; i < 20; i++) {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "💜";
        heart.style.left = (50 + (Math.random()*20 - 10)) + "vw";
        heart.style.fontSize = Math.random() * 18 + 14 + "px";
        heart.style.animationDuration = Math.random() * 2 + 2 + "s";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 4000);
      }
    }
  </script>

</body>
</html>
